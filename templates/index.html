<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budget Assistant</title>

<style>
:root {
    --bg: #ecfdf5;
    --card-bg: #ffffff;
    --primary: #1e3a8a;
    --accent: #16a34a;
    --text-main: #1f2937;
    --text-soft: #6b7280;
    --radius: 14px;
    --shadow: 0 8px 20px rgba(0,0,0,0.07);
}

body {
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: var(--card-bg);
    padding: 30px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

h2 {
    text-align: center;
    color: var(--primary);
}

p {
    color: var(--text-soft);
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: var(--radius);
    border: 1px solid #d7d9df;
    font-size: 15px;
}

button {
    margin-top: 12px;
    padding: 12px;
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    cursor: pointer;
}

.chat-box {
    margin-top: 20px;
    background: #f9fafc;
    padding: 15px;
    border-radius: var(--radius);
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #e5e7eb;
}

.msg {
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #e5e7eb;
}

.msg strong {
    color: var(--primary);
}
</style>
</head>

<body>

{% if chat is none %}
<div class="container">
    <h2>💵 Budget Assistant</h2>
    <p>
        Enter your income, expenses, and savings goal to receive
        a clear financial plan.
    </p>
    <button id="startBtn">Start Budgeting</button>
</div>

<script>
document.getElementById("startBtn").onclick = async () => {
    await fetch("/start", { method: "POST" });
    window.location.href = "/chat";
};
</script>

{% else %}
<div class="container">
    <h2>📊 Your Money Plan</h2>

    <p>
        Example: Income $2500, rent $900, food $300, save $400
    </p>

    <form id="chatForm">
        <input
            id="chatInput"
            placeholder="Describe your financial situation..."
            required
        />
        <button type="submit">Review My Budget</button>
    </form>

    <div class="chat-box" id="chatBox">
        {% for msg in chat %}
        <div class="msg">
            <strong>{{ msg.role }}:</strong> {{ msg.content }}
        </div>
        {% endfor %}
    </div>
</div>

<script>
document.getElementById("chatForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const input = document.getElementById("chatInput");
    const message = input.value;
    input.value = "";

    const res = await fetch("/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
    });

    const data = await res.json();
    const box = document.getElementById("chatBox");

    box.innerHTML += `<div class="msg"><strong>You:</strong> ${message}</div>`;
    box.innerHTML += `<div class="msg"><strong>Budget Coach:</strong> ${data.response}</div>`;
    box.scrollTop = box.scrollHeight;
});
</script>
{% endif %}

</body>
</html>
